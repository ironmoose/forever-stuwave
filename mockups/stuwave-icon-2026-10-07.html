<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1800">
<title>STUwave Icon</title>
<style>
/* Design reference, not shipped art. Fonts are the addon's own bundled faces, same as the other mockups. */
@font-face { font-family: "FS Display"; src: url("../forever-stuwave/Media/Fonts/FSDisplay-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "FS Mono"; src: url("../forever-stuwave/Media/Fonts/MononokiNerdFontMono-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Share Tech Mono"; src: url("../forever-stuwave/Media/Fonts/ShareTechMono-Regular.ttf"); }

:root {
  color-scheme: dark;
  /* Theme.lua tokens */
  --bg: #1a1025;
  --scrim: #0d0620;
  --track: #0a0416;
  --line: #3a2168;
  --violet: #a855f7;
  --pink: #ff2e97;
  --cyan: #22e0ff;
  --gold: #ffd23f;
  --amber: #ffb648;
  --muted: #9d93c4;
  --text: #e2e8f0;
  --font-display: "FS Display", "Orbitron", sans-serif;
  --font-mono: "FS Mono", "Mononoki", "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-note: "Share Tech Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #07030e; }
body { width: 1800px; height: 1170px; position: relative; color: var(--text); font-family: var(--font-mono); font-weight: 700; }

/* ------------------------------------------------------------------ header */
.top { position: absolute; left: 48px; top: 34px; right: 48px; }
.word { font-family: var(--font-display); font-size: 30px; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.word i { font-style: normal; color: var(--pink); }
.sub { margin-top: 10px; font-family: var(--font-note); font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--muted); }
.sub b { color: var(--cyan); font-weight: 400; }

.h2 { position: absolute; left: 48px; font-family: var(--font-note); font-weight: 400; font-size: 17px; letter-spacing: .14em; text-transform: uppercase; color: var(--violet); display: flex; align-items: center; gap: 14px; right: 48px; }
.h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(168,85,247,.45), rgba(58,33,104,.1)); }

/* ------------------------------------------------------------------ concept cards */
.cards { position: absolute; left: 48px; right: 48px; top: 176px; display: grid; grid-template-columns: 560px 1fr; gap: 24px; }
.card { position: relative; height: 380px; background: var(--scrim); border: 1px solid var(--line); padding: 18px 20px 0;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.card .tag { display: flex; align-items: baseline; gap: 14px; }
.card .tag b { font-family: var(--font-display); font-size: 34px; color: var(--pink); line-height: 1; }
.card .tag span { font-family: var(--font-note); font-weight: 400; font-size: 17px; line-height: 1.3; color: var(--text); }
.sizes { position: absolute; left: 20px; right: 20px; bottom: 22px; height: 300px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 6px; }
.card.wide .sizes { justify-content: flex-start; gap: 56px; padding: 0 20px; }
.vr { align-self: stretch; width: 1px; background: var(--line); margin: 0 -6px; }
.sz { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sz svg { display: block; }
.sz span { font-family: var(--font-note); font-weight: 400; font-size: 14px; color: var(--muted); letter-spacing: .08em; }
.sz.real span { color: var(--cyan); }
.s64 { width: 64px; height: 64px; } .s32 { width: 32px; height: 32px; } .s24 { width: 24px; height: 24px; } .s16 { width: 16px; height: 16px; }
.floorline { position: absolute; left: 20px; right: 20px; bottom: 56px; height: 1px; background: rgba(58,33,104,.5); }

/* ------------------------------------------------------------------ placement sketches */
.places { position: absolute; left: 48px; right: 48px; top: 640px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.pl { position: relative; }
.pl .cap { font-family: var(--font-note); font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--cyan); margin-bottom: 12px; }
.pl .cap i { font-style: normal; color: var(--pink); margin-right: 8px; }
.frame { position: relative; width: 100%; height: 372px; border: 1px solid var(--line); overflow: hidden;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
/* the sketch is authored in addon UI units and zoomed 2x */
.skz { zoom: 2; }
.sk { position: relative; width: 275px; height: 186px; overflow: hidden;
  background: linear-gradient(180deg, #0a0418 0%, #1c0a35 55%, #2c1050 100%); }
.sk::before { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(168,85,247,.07) 0 1px, transparent 1px 24px), repeating-linear-gradient(0deg, rgba(168,85,247,.07) 0 1px, transparent 1px 24px); }
.sk > * { position: absolute; }

/* minimap face + bezel row (Minimap.lua: map 250, row 0.17 m, keys 0.12 m) */
.mapface { border: 1px solid color-mix(in srgb, var(--cyan) 60%, var(--violet));
  background: repeating-linear-gradient(0deg, rgba(0,0,0,.34) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, rgba(34,224,255,.05), rgba(124,58,237,.14) 55%, rgba(12,6,32,.3)), #0c0620; }
.mapface::after { content: ""; position: absolute; left: 30px; right: 0; top: 26px; bottom: 0;
  background: radial-gradient(ellipse at 20% 80%, rgba(34,224,255,.10), transparent 60%); }
.bezel { background: linear-gradient(180deg,#090515,#040209); border: 1px solid rgba(168,85,247,.28); border-top-color: rgba(168,85,247,.5); }

/* cut-corner square: TL and BR chamfer, 1px ring through a stacked fill (same trick as the config mock) */
.cut { position: absolute; background: var(--c, var(--violet)); }
.cut > i { position: absolute; inset: 1px; background: var(--f, #0b0618); }
.cut.c4, .cut.c4 > i { clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px); }
.cut.c5, .cut.c5 > i { clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px); }
.cut.c4 > i { clip-path: polygon(3.3px 0, 100% 0, 100% calc(100% - 3.3px), calc(100% - 3.3px) 100%, 0 100%, 0 3.3px); }
.cut.c5 > i { clip-path: polygon(4.3px 0, 100% 0, 100% calc(100% - 4.3px), calc(100% - 4.3px) 100%, 0 100%, 0 4.3px); }
.cut svg { position: absolute; z-index: 1; }
.cut .ul { position: absolute; z-index: 1; left: 20%; right: 20%; bottom: 13%; height: 2px; background: var(--c); box-shadow: 0 0 4px var(--c); }
.glow { filter: drop-shadow(0 0 3px var(--c)) drop-shadow(0 0 7px var(--c)); }

.ghostbtn { width: 24px; height: 24px; border-radius: 50%; background: #1b1530; border: 1px solid #3c3553; opacity: .75; }
.ghostbtn::after { content: ""; position: absolute; inset: 7px; border-radius: 3px; background: #4a4262; }
.ghostbtn.g2::after { border-radius: 50%; background: #5a4a74; }

.ring-glow { filter: drop-shadow(0 0 3px rgba(34,224,255,.9)) drop-shadow(0 0 8px rgba(34,224,255,.55)); }
.lbl { font-family: var(--font-display); font-size: 7px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; text-shadow: 0 0 6px rgba(34,224,255,.5); }
.lcd { background: #04020c; border: 1px solid rgba(34,224,255,.35); box-shadow: inset 0 0 6px rgba(0,0,0,.85); font-family: var(--font-note); font-weight: 400; font-size: 9px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.lcd span:first-child { color: var(--cyan); } .lcd span:last-child { color: var(--amber); }
.tab { display: flex; align-items: center; justify-content: space-between; padding: 0 5px; font-family: var(--font-note); font-weight: 400; font-size: 9px; color: var(--cyan); }
.tab > * { position: relative; z-index: 1; }
.tab b { color: var(--amber); font-weight: 400; }

/* addon tooltip: dark fill, violet 1px ring, cut TL and BR (config window .q tooltip language) */
.tip { position: absolute; z-index: 20; white-space: nowrap; padding: 5px 9px 5px 9px; border: 1px solid var(--violet);
  font-family: var(--font-mono); font-weight: 700; font-size: 9px; line-height: 1.5; color: var(--text);
  background:
    linear-gradient(135deg, transparent 3.5px, var(--violet) 3.5px 4.7px, transparent 4.7px),
    linear-gradient(315deg, transparent 3.5px, var(--violet) 3.5px 4.7px, transparent 4.7px),
    #120a22;
  background-origin: border-box;
  clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  filter: none; }
.tip .t { color: #fff; letter-spacing: .01em; }
.tip .t i { font-style: normal; color: var(--pink); }
.tip .l { color: var(--muted); }
.tip .l em { font-style: normal; color: var(--cyan); }
.tipw { position: absolute; z-index: 20; filter: drop-shadow(0 2px 4px rgba(0,0,0,.7)); }
.tipw .tip { position: relative; }
</style>
</head>

        <div class="t">Forever <i>STU</i>wave</div>
        <div class="l"><em>Click:</em> settings</div>
      </div></div>
    </div></div></div>
  </div>

  <!-- (c) end of the micro bar -->
  <div class="pl">
    <div class="cap"><i>c</i>End of the micro bar</div>
    <div class="frame"><div class="skz"><div class="sk" id="deck"></div></div></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------- concept cards */
const ico = (id, s, real, label) => `<div class="sz ${real ? 'real' : ''}"><svg width="${s}" height="${s}"><use href="#${id}"/></svg><span>${label || s}</span></div>`;
document.getElementById('cards').innerHTML =
  `<div class="card"><div class="tag"><b>A</b><span>STU lettering over the triangle, the button icon</span></div>
     <div class="floorline"></div>
     <div class="sizes">${[128, 64, 32].map(s => ico('ic-a', s, false)).join('')}${[24, 20, 16].map(s => ico('ic-a', s, true)).join('')}
       <div class="vr"></div>${ico('ic-b', 16, true, 'S 16')}</div></div>
   <div class="card wide"><div class="tag"><b>C</b><span>STU over WAVE, the large logo for the config header and README</span></div>
     <div class="floorline"></div>
     <div class="sizes">${ico('ic-c', 256, false)}${ico('ic-c', 128, false)}${ico('ic-c', 64, false)}</div></div>`;

/* ---------------------------------------------------------------- micro-bar sketch (MicroBars.lua: key 34x26, lean .34, nested) */
(function () {
  const KW = 34, KH = 26, L = 11.6, P = KW - L + 3, X0 = 14, Y0 = 18;
  const COL = ['#22e0ff', '#a855f7', '#ff2e97'];
  const GLY = [
    '<circle cx="8" cy="8" r="5"/>',
    '<rect x="3.5" y="3.5" width="9" height="9"/>',
    '<path d="M8 2.5L13.5 8L8 13.5L2.5 8Z"/>',
    '<path d="M8 3V13M3 8H13"/>',
    '<path d="M8 3L13 12.5H3Z"/>',
    '<path d="M4 4V12M8 6V12M12 3V12"/>',
    '<circle cx="8" cy="8" r="5"/><circle cx="8" cy="8" r="1.4"/>',
  ];
  let s = `<defs><linearGradient id="kf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f38"/><stop offset="1" stop-color="#07030f"/></linearGradient>
    <linearGradient id="kfh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16345a"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
    <filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>`;
  /* deck chassis: dark glass, violet ring, cut TL / BR */
  s += `<path d="M10 10H246V68L240 74H4V16Z" transform="translate(0,2)" fill="#0a0518" stroke="#a855f7" stroke-opacity=".7" stroke-width="1"/>`;
  const key = (i, ours) => {
    const x = X0 + i * P, y = Y0;
    const pts = `${x + L},${y} ${x + KW},${y} ${x + KW - L},${y + KH} ${x},${y + KH}`;
    const c = COL[i % 3];
    let o = '';
    const edge = ours ? '#22e0ff' : c;
    const ledW = ours ? KW - L - 6 : 11;
    const lx = x + (KW + L) / 2 - L * (KH - 4) / KH - ledW / 2;
    if (ours) o += `<polygon points="${pts}" fill="none" stroke="#22e0ff" stroke-width="4" opacity=".75" filter="url(#gl)"/>`;
    o += `<polygon points="${pts}" fill="url(#${ours ? 'kfh' : 'kf'})"/>`;
    o += `<path d="M${x + L + 1.2} ${y + 1}H${x + KW - 1}" stroke="#fff" stroke-width="1" opacity="${ours ? .7 : .3}"/>`;
    o += `<polygon points="${pts}" fill="none" stroke="${edge}" stroke-width="${ours ? 1.5 : 1}" stroke-opacity="${ours ? 1 : .62}"/>`;
    if (ours) {
      o += `<svg x="${x + (KW + L) / 2 - 12 - 1}" y="${y + 1}" width="22" height="22"><use href="#ic-a"/></svg>`;
    } else {
      o += `<g transform="translate(${x + 10.2} ${y + 5})" fill="none" stroke="${c}" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" opacity=".9">${GLY[i % GLY.length]}</g>`;
    }
    o += `<rect x="${lx.toFixed(1)}" y="${y + KH - 5}" width="${ledW}" height="2" fill="${ours ? '#bff7ff' : c}" opacity="${ours ? 1 : .8}"/>`;
    return o;
  };
  for (let i = 0; i < 8; i++) s += key(i, i === 7);
  /* bag row under the keys, ghosted */
  for (let i = 0; i < 6; i++) s += `<rect x="${24 + i * 24}" y="52" width="19" height="19" rx="2" fill="#0f0820" stroke="#3a2168"/>`;
  const deck = document.getElementById('deck');
  deck.innerHTML = `<svg style="position:absolute;left:0;top:92px" width="256" height="80" viewBox="0 0 256 80" xmlns="http://www.w3.org/2000/svg">${s}</svg>
    <div class="tipw" style="right:12px; top:50px"><div class="tip">
      <div class="t">Forever <i>STU</i>wave</div>
      <div class="l"><em>Click:</em> settings</div>
    </div></div>`;
})();
</script>
</body>
</html>
